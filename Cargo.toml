[package]
name = "clickhouse-provider"
version = "2.13.0"
authors = ["Eugene The Dream"]
rust-version = "1.91.0"
edition = "2021"

[dependencies]
anyhow = "1.0.51"

openssl-probe = { version = "0.1.5" }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "signal"] }

dotenv = "0.15.0"
tracing = { version = "0.1.13", features = ["log"] }
tracing-subscriber = { version = "0.3.18", features = [
    "env-filter",
    "fmt",
    "registry",
    "std",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

fastnear-primitives = "0.37.0"
fastnear-neardata-fetcher = "0.37.0"

clickhouse = { version = "0.13", features = ["native-tls", "lz4"] }
reqwest = { version = "0.12.2", features = ["json"] }

zstd = "0.13.3"


