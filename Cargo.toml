[package]
name = "clickhouse-provider"
version = "2.10.3"
authors = ["Eugene The Dream"]
rust-version = "1.91.0"
edition = "2021"

[dependencies]
anyhow = "1.0.51"

openssl-probe = { version = "0.1.5" }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread"] }

dotenv = "0.15.0"
tracing = { version = "0.1.13", features = ["log"] }
tracing-subscriber = { version = "0.3.18", features = [
    "env-filter",
    "fmt",
    "registry",
    "std",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

fastnear-primitives = "0.34.2"
fastnear-neardata-fetcher = "0.34.2"

clickhouse = { version = "0.13", features = ["native-tls", "lz4"] }
reqwest = { version = "0.12.2", features = ["json"] }

signal-hook = "0.3.18"
zstd = "0.13.3"
rayon = "1.10"

# k2v_client
base64 = "0.22"
sha2 = "0.10"
hex = "0.4.3"
http = "1.0"
http-body-util = "0.1"
log = "0.4.20"
aws-sigv4 = { version = "1.1", default-features = false }
aws-sdk-config = { version = "1.62", default-features = false }
percent-encoding = "2.2"
hyper = { version = "1.0", default-features = false, features = ["http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.26", default-features = false, features = ["http1", "http2", "ring", "rustls-native-certs"] }
thiserror = "2.0"



